services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD muss gesetzt und nicht leer sein}"
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - sims_sql_data:/var/opt/mssql

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - sims_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  api:
    image: sims-api:dev
    build:
      context: .
      dockerfile: sims/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__SIMS: "Server=sqlserver,1433;Database=SIMS;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD muss gesetzt sein};Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      - sqlserver
      - redis
    restart: unless-stopped

  frontend:
    image: sims-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./frontend/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sims_sql_data:
    name: sims_sql_data
  sims_redis_data:
    name: sims_redis_data
